# Verifies every PDF added under documents/ in a pull request and reports the
# verdicts in the job summary. Store the key as the repository secret
# TRUSTMYDOCS_API_KEY. Documents in a repository are personal data: use this
# only in a private repository with a retention policy, or adapt it to fetch
# from your own storage.
name: Verify documents

on:
  pull_request:
    paths: ["documents/**/*.pdf"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify added or changed tax notices
        env:
          TRUSTMYDOCS_API_KEY: ${{ secrets.TRUSTMYDOCS_API_KEY }}
        run: |
          set -o pipefail
          status=0
          for f in $(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD -- 'documents/**/*.pdf'); do
            if npx -y trustmydocs verify "$f" --no-fields --json > out.json; then verdict=authentic; else verdict=$(jq -r .verdict out.json 2>/dev/null || echo error); fi
            echo "| $f | $verdict | $(jq -r '.signature' out.json 2>/dev/null) | $(jq -r '.latest // "-"' out.json 2>/dev/null) |" >> rows.md
            [ "$verdict" = authentic ] || status=1
          done
          { echo "| Document | Verdict | Signature | Latest notice |"; echo "| --- | --- | --- | --- |"; cat rows.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
