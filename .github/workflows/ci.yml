name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - name: Repository hygiene (no keys, no documents, one-line commits)
        run: scripts/check-hygiene.sh
      - name: CLI smoke test without a key
        run: |
          node dist/cli.js --help | grep -q "trustmydocs verify"
          node dist/cli.js --version
          if TRUSTMYDOCS_CONFIG_DIR="$RUNNER_TEMP/none" node dist/cli.js quota < /dev/null; then
            echo "quota without a key must fail" >&2; exit 1
          fi
      - name: Package contents
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q "dist/cli.js" pack.txt
          grep -q "dist/mcp.js" pack.txt
          grep -q "dist/index.d.ts" pack.txt
          if grep -qE "\.(pdf|png|jpe?g)$" pack.txt; then echo "documents in the tarball" >&2; exit 1; fi
